services:
  postgres:
    image: postgres:17-alpine
    container_name: onlinestore-pg
    network_mode: host
    command: ["postgres", "-c", "port=5434", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: onlinestore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d onlinestore -p 5434"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
